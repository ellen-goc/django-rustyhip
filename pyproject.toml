[project]
name = "django-rustyhip"
version = "0.1.0"
description = "Django database backend that talks to a rustyhip Lambda (SQLite-over-S3 via turbolite) over HTTP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LicenseRef-KICONIAWORKS-Customers" }
authors = [{ name = "monkut" }]
keywords = ["django", "database", "backend", "sqlite", "s3", "lambda", "rustyhip"]
classifiers = [
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
]
dependencies = [
  "django>=4.2",
]

[project.urls]
Homepage = "https://github.com/monkut/django-rustyhip"
Repository = "https://github.com/monkut/django-rustyhip"
Issues = "https://github.com/monkut/django-rustyhip/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rustyhip"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-django>=4.8",
  "ruff>=0.5",
  "pyright>=1.1",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "TCH"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
